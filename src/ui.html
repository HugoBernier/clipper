<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Clipper</title>
<!-- Visuel brut : le design system viendra à l'itération 11. -->
<style>
  body { font: 14px system-ui; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  nav { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid #8884; }
  nav button[aria-selected="true"] { font-weight: bold; }
  section { flex: 1; min-height: 0; }
  #clips-view { display: flex; }
  #clips-view[hidden], #settings-view[hidden] { display: none; }
  #list { width: 340px; overflow: auto; border-right: 1px solid #8884; }
  #list div { padding: 6px 12px; cursor: pointer; user-select: none; }
  #list div.selected { background: #8883; }
  #list small { display: block; opacity: .7; }
  #viewer { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  video { flex: 1; min-height: 0; width: 100%; background: #000; }
  #settings-view { overflow: auto; padding: 0 16px; max-width: 560px; }
  label { display: block; margin: 12px 0; }
  #error, #clip-status.error { color: #c00; }
</style>
<nav>
  <button id="tab-clips" aria-selected="true">Clips</button>
  <button id="tab-settings" aria-selected="false">Réglages</button>
</nav>
<section id="clips-view">
  <div id="list"></div>
  <div id="viewer">
    <video id="player" controls></video>
    <div>
      <button id="copy" disabled>Copier</button>
      <button id="rename" disabled>Renommer…</button>
      <button id="delete" disabled>Supprimer</button>
      <button id="reveal" disabled>Montrer dans l'Explorateur</button>
    </div>
    <p id="clip-status" role="status"></p>
  </div>
</section>
<section id="settings-view" hidden>
<form id="form">
  <label>Résolution
    <select name="height">
      <option value="720">720p</option>
      <option value="1080">1080p</option>
      <option value="1440">1440p</option>
    </select>
  </label>
  <label>Images par seconde
    <select name="fps">
      <option>30</option><option>60</option>
    </select>
  </label>
  <label>Qualité
    <select name="quality">
      <option value="low">Basse</option>
      <option value="medium">Moyenne</option>
      <option value="high">Haute</option>
      <option value="very_high">Très haute</option>
    </select>
  </label>
  <label>Durée du clip
    <input name="clip_seconds" type="number" min="10" max="300" step="1"> s
  </label>
  <p id="estimate"></p>
  <label><input name="microphone" type="checkbox"> Micro</label>
  <label>Quel micro
    <select name="microphone_device"></select>
  </label>
  <label>Volume du micro
    <input name="microphone_volume" type="range" min="0" max="200" step="5">
    <output id="volume"></output> %
  </label>
  <label>Raccourci
    <input name="hotkey" readonly>
    <button id="capture" type="button">Changer…</button>
  </label>
  <label>Dossier des clips
    <span id="clips-dir"></span>
    <button id="folder" type="button">Changer…</button>
  </label>
  <label><input id="startup" type="checkbox"> Démarrer avec Windows</label>
</form>
<p id="error" role="alert"></p>
</section>
<script>
  const host = window.chrome.webview;
  const $ = id => document.getElementById(id);
  const form = $('form');
  const send = (command, arg) => host.postMessage(arg === undefined ? command : command + '\n' + arg);
  let capturing = false;

  // Messages de Rust : « state » (réglages, lignes clé=valeur), « clips » (une ligne
  // nom⇥date⇥taille⇥durée par clip), « copied », « error ».
  host.addEventListener('message', e => {
    const [kind, ...lines] = e.data.split('\n');
    if (kind === 'clips') return showClips(lines.filter(Boolean));
    if (kind === 'copied') return status(`Copié : ${lines[0]}. Ctrl+V dans Discord pour l'envoyer.`);
    if (kind === 'renamed') {
      reselect = lines[0];
      renaming = null;
      return;
    }
    if (kind === 'error') {
      if (renaming) reselect = renaming;
      renaming = null;
      return status(lines.join(' '), true);
    }
    if (kind !== 'state') return;
    const state = Object.fromEntries(lines.map(line => {
      const i = line.indexOf('=');
      return [line.slice(0, i), line.slice(i + 1)];
    }));
    // Liste des micros avant d'y sélectionner le micro choisi.
    const mics = form.elements.microphone_device;
    mics.textContent = '';
    mics.append(new Option('Par défaut (micro de communication de Windows)', ''));
    const parts = (state.microphones ?? '').split('\t');
    for (let i = 0; i + 1 < parts.length; i += 2) mics.append(new Option(parts[i + 1], parts[i]));
    if (![...mics.options].some(o => o.value === state.microphone_device)) {
      // Liste indisponible : on ne sait pas s'il est branché.
      const label = state.microphones === undefined ? 'Micro choisi' : 'Micro choisi (débranché : micro par défaut)';
      mics.append(new Option(label, state.microphone_device));
    }
    for (const el of form.elements) {
      if (!(el.name in state)) continue;
      if (el.type === 'checkbox') el.checked = state[el.name] === 'true';
      else el.value = state[el.name];
    }
    capturing = false;
    $('volume').value = state.microphone_volume;
    $('clips-dir').textContent = state.clips_dir;
    $('startup').checked = state.startup === 'true';
    $('estimate').textContent =
      `≈ ${state.estimate_mb} Mo par clip (${state.width}×${state.height}, ${state.bitrate_mbps} Mb/s)`;
    $('error').textContent = state.error ?? '';
  });

  form.addEventListener('submit', e => e.preventDefault());
  form.addEventListener('change', e => {
    const el = e.target;
    if (!el.name || el.name === 'hotkey') return;
    send('set', `${el.name}=${el.type === 'checkbox' ? el.checked : el.value}`);
  });
  form.elements.microphone_volume.addEventListener('input', e => $('volume').value = e.target.value);
  $('startup').addEventListener('change', e => send('startup', String(e.target.checked)));
  $('folder').addEventListener('click', () => send('pick_folder'));
  $('capture').addEventListener('click', () => {
    capturing = true;
    send('capture');
    form.elements.hotkey.value = 'Appuyez sur la combinaison (Échap : annuler)';
  });

  // Format accepté par `parse_hotkey` : modificateurs puis F1–F24, A–Z ou 0–9.
  // Lettres d'après `key` (AZERTY : la touche A donne VK_A), chiffres et F1–F24
  // d'après `code` (la rangée du haut donne VK_0–VK_9 quelle que soit la disposition).
  document.addEventListener('keydown', e => {
    if (!capturing) return;
    e.preventDefault();
    if (e.code === 'Escape') return send('get');
    const key = keyName(e);
    if (!key) return; // modificateur seul : on attend la touche
    const parts = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Win', key];
    send('set', 'hotkey=' + parts.filter(Boolean).join('+'));
  });
  function keyName({ key, code }) {
    if (/^[a-z]$/i.test(key)) return key.toUpperCase();
    // AltGr (Ctrl+Alt) ou disposition non latine : `key` n'est pas une lettre.
    if (/^Key[A-Z]$/.test(code)) return code.slice(3);
    if (/^Digit[0-9]$/.test(code)) return code.slice(5);
    if (/^F([1-9]|1[0-9]|2[0-4])$/.test(code)) return code;
    return null;
  }

  // Onglets.
  for (const [tab, view] of [['tab-clips', 'clips-view'], ['tab-settings', 'settings-view']]) {
    $(tab).addEventListener('click', () => {
      // Changer d'onglet met fin à une capture du raccourci (Rust le remet).
      if (capturing) send('get');
      for (const t of ['tab-clips', 'tab-settings']) $(t).setAttribute('aria-selected', String(t === tab));
      $('clips-view').hidden = view !== 'clips-view';
      $('settings-view').hidden = view !== 'settings-view';
    });
  }

  // Bibliothèque.
  const player = $('player');
  let current = null;
  // Renommage en cours (ancien nom), puis clip à resélectionner à la liste suivante :
  // le nouveau nom annoncé par Rust, ou l'ancien si le renommage a échoué.
  let renaming = null;
  let reselect = null;

  function status(text, error = false) {
    $('clip-status').textContent = text;
    $('clip-status').classList.toggle('error', error);
  }

  function showClips(lines) {
    const list = $('list');
    const scroll = list.scrollTop;
    list.textContent = '';
    let found = false;
    for (const line of lines) {
      const [name, modified, size, duration] = line.split('\t');
      const row = document.createElement('div');
      const date = new Date(Number(modified)).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
      row.append(name);
      const details = document.createElement('small');
      details.textContent = `${date} · ${formatDuration(duration)} · ${(size / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} Mo`;
      row.append(details);
      row.dataset.name = name;
      row.dataset.modified = modified;
      row.addEventListener('click', () => select(name));
      // Le glisser HTML ne transporte pas de fichier : Rust lance un glisser natif.
      row.addEventListener('pointerdown', down => {
        if (down.button !== 0) return;
        const move = m => {
          if (Math.abs(m.clientX - down.clientX) + Math.abs(m.clientY - down.clientY) < 6) return;
          stop();
          send('drag', name);
        };
        const stop = () => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', stop);
          removeEventListener('pointercancel', stop);
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', stop);
        addEventListener('pointercancel', stop);
      });
      list.append(row);
      found ||= name === current;
    }
    if (!lines.length) list.textContent = 'Aucun clip pour l\'instant.';
    list.scrollTop = scroll;
    if (!found) unload();
    if (reselect) {
      const pick = reselect;
      reselect = null;
      if ([...list.children].some(r => r.dataset.name === pick)) select(pick, false);
    }
    highlight();
  }

  function formatDuration(seconds) {
    if (!seconds) return '?';
    const s = Math.round(Number(seconds));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function select(name, play = true) {
    current = name;
    const row = [...$('list').children].find(r => r.dataset.name === name);
    // `v` : un clip renommé puis remplacé sous le même nom n'est pas lu depuis le cache.
    player.src = `https://clips.clipper/${encodeURIComponent(name)}?v=${row?.dataset.modified ?? ''}`;
    if (play) player.play().catch(() => {});
    highlight();
  }

  // Libère le fichier (lu par le lecteur) avant un renommage ou une suppression.
  function unload() {
    current = null;
    player.pause();
    player.removeAttribute('src');
    player.load();
    highlight();
  }

  function highlight() {
    for (const row of $('list').children) row.classList?.toggle('selected', row.dataset.name === current);
    for (const id of ['copy', 'rename', 'delete', 'reveal']) $(id).disabled = !current;
  }

  $('copy').addEventListener('click', () => send('copy', current));
  $('reveal').addEventListener('click', () => send('reveal', current));
  $('rename').addEventListener('click', () => {
    const name = prompt('Nouveau nom du clip', current.replace(/\.mp4$/i, ''));
    if (!name) return;
    const old = current;
    unload();
    renaming = old;
    send('rename', `${old}\t${name}`);
  });
  $('delete').addEventListener('click', () => {
    if (!confirm(`Mettre ${current} à la corbeille ?`)) return;
    const old = current;
    unload();
    send('delete', old);
  });

  // Un bouton cliqué à la souris rend le focus : Espace commande alors le lecteur au
  // lieu de rejouer « Copier ». Au clavier (Tab), le bouton garde Espace.
  for (const button of document.querySelectorAll('nav button, #viewer button')) {
    button.addEventListener('click', e => { if (e.detail > 0) button.blur(); });
  }

  // Raccourcis du lecteur : espace, flèches (±5 s), F (plein écran). Le lecteur
  // sélectionné gère lui-même espace et flèches.
  document.addEventListener('keydown', e => {
    if (capturing || $('clips-view').hidden || !current) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (['INPUT', 'SELECT', 'BUTTON'].includes(e.target.tagName)) return;
    const own = e.target === player;
    if (e.code === 'Space' && !own) player.paused ? player.play() : player.pause();
    else if (e.code === 'ArrowLeft' && !own) player.currentTime -= 5;
    else if (e.code === 'ArrowRight' && !own) player.currentTime += 5;
    else if (e.code === 'KeyF') document.fullscreenElement ? document.exitFullscreen() : player.requestFullscreen();
    else return;
    e.preventDefault();
  });

  send('get');
  send('clips');
</script>
</html>
