<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="cl-row">
<span class="cl-number"><input class="cl-input" type="number" min="10" max="300" step="1" value="30" aria-label="Durée en secondes" data-duration><span>s</span></span>
</div>
<script>
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var toast = document.getElementById('toast'), timer, open = null;
function say(text) {
  if (!toast) return;
  toast.querySelector('.cl-toast__text').textContent = text;
  toast.hidden = false; clearTimeout(timer);
  timer = setTimeout(function () { toast.hidden = true; }, 2400);
}
function current() { return document.querySelector('.cl-clip[aria-selected="true"]'); }
function pick(row) {
  $$('.cl-clip').forEach(function (r) { r.setAttribute('aria-selected', r === row ? 'true' : 'false'); });
  var t = document.querySelector('[data-v-title]'), f = document.querySelector('[data-v-file]');
  if (row && t) { t.textContent = row.getAttribute('data-title'); f.textContent = row.getAttribute('data-file'); }
  $$('.cl-viewer button').forEach(function (b) { b.disabled = !row; });
}
function count() { var c = document.querySelector('.cl-count'); if (c) c.textContent = $$('.cl-clip').length; }
function show(name) {
  var d = document.querySelector('[data-dialog="' + name + '"]'); if (!d) return;
  var row = current(); if (!row) return;
  var file = row.getAttribute('data-file');
  var f = d.querySelector('[data-dialog-file]'); if (f) f.textContent = file;
  var i = d.querySelector('input'); if (i) i.value = file.replace(/\.mp4$/, '');
  d.hidden = false; open = { d: d, from: document.activeElement };
  (i || d.querySelector('[data-cancel]')).focus(); if (i) i.select();
}
function close() { if (!open) return; open.d.hidden = true; if (open.from && open.from.focus) open.from.focus(); open = null; }
document.addEventListener('click', function (e) {
  var row = e.target.closest('.cl-clip'); if (row) pick(row);
  var b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-tab')) {
    $$('.cl-tab').forEach(function (o) { o.setAttribute('aria-selected', o === b ? 'true' : 'false'); });
    $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== b.getAttribute('data-tab'); });
  }
  var g = b.closest('.cl-seg');
  if (g) $$('button', g).forEach(function (o) { o.setAttribute('aria-checked', o === b ? 'true' : 'false'); });
  if (b.hasAttribute('data-copy')) say('Copié');
  if (b.hasAttribute('data-delete')) show('delete');
  if (b.hasAttribute('data-rename')) show('rename');
  if (b.hasAttribute('data-cancel')) close();
  if (b.hasAttribute('data-confirm')) {
    var r = current(), next = r && (r.nextElementSibling || r.previousElementSibling);
    if (r) r.remove(); open.from = null; close(); count(); pick(next);
  }
  if (b.hasAttribute('data-confirm-rename')) {
    var v = open.d.querySelector('input').value.trim(), c = current();
    if (v && c) { c.setAttribute('data-file', v + '.mp4'); c.querySelector('.cl-clip__file').textContent = v + '.mp4'; pick(c); }
    close();
  }
  if (b.hasAttribute('data-capture')) {
    var cell = b.parentNode, before = cell.innerHTML;
    cell.innerHTML = '<span class="cl-capture">Appuyez sur la combinaison</span><span class="cl-kbd"><kbd>Échap</kbd></span>';
    var done = function (ev) { ev.preventDefault(); document.removeEventListener('keydown', done, true); cell.innerHTML = before; };
    document.addEventListener('keydown', done, true);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && open) return close();
  var row = e.target.closest && e.target.closest('.cl-clip');
  if (row && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    var n = e.key === 'ArrowDown' ? row.nextElementSibling : row.previousElementSibling;
    if (n) { n.focus(); pick(n); } e.preventDefault();
  }
  if (row && e.key === 'Delete') show('delete');
  if (row && e.key === 'F2') show('rename');
});
// Dropdown : liste dessinée par le design system (pas celle du système).
// refocus : rendre le focus au bouton (clavier, choix), jamais après un clic ailleurs.
function dropdownOpen(dd, open, refocus) {
  var button = dd.querySelector('.cl-dropdown__button'), menu = dd.querySelector('.cl-dropdown__menu');
  button.setAttribute('aria-expanded', String(open));
  menu.hidden = !open;
  $$('.cl-dropdown__option', menu).forEach(function (o) { o.classList.toggle('is-active', open && o.getAttribute('aria-selected') === 'true'); });
  if (!open && refocus !== false) button.focus();
}
function dropdownPick(dd, option) {
  $$('.cl-dropdown__option', dd).forEach(function (o) { o.setAttribute('aria-selected', String(o === option)); });
  dd.querySelector('.cl-dropdown__value').textContent = option.querySelector('span').textContent;
  dropdownOpen(dd, false);
}
document.addEventListener('click', function (e) {
  var dd = e.target.closest('.cl-dropdown');
  $$('.cl-dropdown').forEach(function (o) { if (o !== dd && !o.querySelector('.cl-dropdown__menu').hidden) dropdownOpen(o, false, false); });
  if (!dd) return;
  var option = e.target.closest('.cl-dropdown__option');
  if (option) return dropdownPick(dd, option);
  if (e.target.closest('.cl-dropdown__button')) dropdownOpen(dd, dd.querySelector('.cl-dropdown__menu').hidden);
});
document.addEventListener('keydown', function (e) {
  var dd = e.target.closest && e.target.closest('.cl-dropdown'); if (!dd) return;
  var menu = dd.querySelector('.cl-dropdown__menu'), options = $$('.cl-dropdown__option', menu);
  var active = options.findIndex(function (o) { return o.classList.contains('is-active'); });
  if (menu.hidden) {
    if (['ArrowDown', 'ArrowUp', 'Enter', ' '].indexOf(e.key) >= 0) { e.preventDefault(); dropdownOpen(dd, true); }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); return dropdownOpen(dd, false); }
  if (e.key === 'Tab') return dropdownOpen(dd, false, false);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    var next = Math.max(0, Math.min(options.length - 1, active + (e.key === 'ArrowDown' ? 1 : -1)));
    options.forEach(function (o, i) { o.classList.toggle('is-active', i === next); });
    options[next].scrollIntoView({ block: 'nearest' });
  }
  if ((e.key === 'Enter' || e.key === ' ') && active >= 0) { e.preventDefault(); dropdownPick(dd, options[active]); }
});
document.addEventListener('input', function (e) {
  if (e.target.hasAttribute('data-duration')) $$('[data-seconds]').forEach(function (n) { n.textContent = e.target.value; });
});
</script>
</body>
</html>
